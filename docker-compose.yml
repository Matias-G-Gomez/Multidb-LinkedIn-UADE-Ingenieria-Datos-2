version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: linkedin_postgres
    environment:
      POSTGRES_DB: linkedin_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d linkedin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: linkedin_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkedin_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: linkedin_neo4j
    environment:
      NEO4J_AUTH: neo4j/secret123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "secret123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # MongoDB - Interfaz Visual - Mongo Express
  mongo-express:
    image: mongo-express
    container_name: linkedin_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb


  # Redis - Intervaz Visual - Redis Commander

  redis-commander:
      image: rediscommander/redis-commander
      container_name: linkedin_redis_commander
      ports:
        - "8082:8081"
      environment:
        - REDIS_HOSTS=local:redis:6379
      depends_on:
        - redis


  # PostgreSQL - Interfaz Visual - pgAdmin
  pgadmin:
      image: dpage/pgadmin4
      container_name: linkedin_pgadmin
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.com
        PGADMIN_DEFAULT_PASSWORD: secret123
      ports:
        - "8083:80"
      depends_on:
        - postgres

volumes:
  postgres_data:
  mongo_data:
  neo4j_data: